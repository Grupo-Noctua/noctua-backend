spring:
  application:
    name: noctua-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/NOCTUA}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 3000
      read-only: true
  jdbc:
    template:
      query-timeout: 15s
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
noctua:
  athena:
    enabled: ${ATHENA_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    database: ${ATHENA_DATABASE:}
    catalog: ${ATHENA_CATALOG:AwsDataCatalog}
    workgroup: ${ATHENA_WORKGROUP:primary}
    output-location: ${ATHENA_OUTPUT_LOCATION:}
    query-timeout: ${ATHENA_QUERY_TIMEOUT:30s}
    poll-interval: ${ATHENA_POLL_INTERVAL:500ms}
    max-rows: ${ATHENA_MAX_ROWS:10000}
    queries:
      total: ${ATHENA_SQL_TOTAL:}
      tecnologia: ${ATHENA_SQL_TECNOLOGIA:}
      senioridade: ${ATHENA_SQL_SENIORIDADE:}
      area: ${ATHENA_SQL_AREA:}
